[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
exclude = ['^[.]venv/', '^tools/']

[[tool.mypy.overrides]]
module = ["aiomysql", "pronouncing", "pymysql", "pymysql.*"]
ignore_missing_imports = true
